<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628"/>
      <stop offset="100%" style="stop-color:#0d2545"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#049FD9"/>
      <stop offset="100%" style="stop-color:#00c8ff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.05" stroke="#049FD9" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="150" y1="0" x2="150" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="450" y1="0" x2="450" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="750" y1="0" x2="750" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1050" y1="0" x2="1050" y2="630"/>
  </g>

  <!-- Cisco bridge/wave icon (stylized) -->
  <g transform="translate(780, 160)" opacity="0.2">
    <!-- Cisco's iconic bridge silhouette: 6 bars of varying height -->
    <rect x="0"   y="120" width="38" height="80"  rx="4" fill="#049FD9"/>
    <rect x="50"  y="80"  width="38" height="120" rx="4" fill="#049FD9"/>
    <rect x="100" y="40"  width="38" height="160" rx="4" fill="#049FD9"/>
    <rect x="150" y="40"  width="38" height="160" rx="4" fill="#049FD9"/>
    <rect x="200" y="80"  width="38" height="120" rx="4" fill="#049FD9"/>
    <rect x="250" y="120" width="38" height="80"  rx="4" fill="#049FD9"/>
  </g>

  <!-- Large decorative circle -->
  <circle cx="1000" cy="315" r="300" fill="none" stroke="#049FD9" stroke-width="1" opacity="0.12"/>
  <circle cx="1000" cy="315" r="200" fill="none" stroke="#049FD9" stroke-width="1" opacity="0.08"/>

  <!-- Blue accent bar -->
  <rect x="80" y="270" width="6" height="90" fill="url(#accent)" rx="3"/>

  <!-- CISCO logo text -->
  <text x="110" y="345" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="108" fill="white" letter-spacing="-2" filter="url(#glow)">CISCO</text>

  <!-- Tagline -->
  <text x="112" y="390" font-family="Arial, sans-serif" font-weight="400" font-size="22" fill="#049FD9" letter-spacing="6">NETWORKING &amp; SECURITY</text>

  <!-- Bottom accent line -->
  <rect x="80" y="420" width="480" height="3" fill="url(#accent)" rx="2" opacity="0.7"/>

  <!-- Partner badge -->
  <rect x="80" y="450" width="220" height="44" rx="4" fill="#049FD9" opacity="0.15" stroke="#049FD9" stroke-width="1"/>
  <text x="190" y="478" font-family="Arial, sans-serif" font-weight="700" font-size="15" fill="#049FD9" text-anchor="middle" letter-spacing="2">PARTNER CONTENT</text>
</svg>
