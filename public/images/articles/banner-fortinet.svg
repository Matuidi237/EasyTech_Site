<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a"/>
      <stop offset="100%" style="stop-color:#2d0a0a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#DA291C"/>
      <stop offset="100%" style="stop-color:#ff5533"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.06" stroke="#DA291C" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="150" y1="0" x2="150" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="450" y1="0" x2="450" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="750" y1="0" x2="750" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1050" y1="0" x2="1050" y2="630"/>
  </g>

  <!-- Large decorative circle -->
  <circle cx="980" cy="315" r="280" fill="none" stroke="#DA291C" stroke-width="1" opacity="0.15"/>
  <circle cx="980" cy="315" r="200" fill="none" stroke="#DA291C" stroke-width="1" opacity="0.1"/>
  <circle cx="980" cy="315" r="120" fill="#DA291C" opacity="0.08"/>

  <!-- Shield icon (simplified) -->
  <g transform="translate(870, 200)" opacity="0.25">
    <path d="M110 20 L200 60 L200 150 C200 210 110 260 110 260 C110 260 20 210 20 150 L20 60 Z" fill="#DA291C"/>
    <path d="M110 70 L160 90 L160 150 C160 185 110 210 110 210 C110 210 60 185 60 150 L60 90 Z" fill="none" stroke="white" stroke-width="3" opacity="0.6"/>
  </g>

  <!-- Red accent bar -->
  <rect x="80" y="270" width="6" height="90" fill="url(#accent)" rx="3"/>

  <!-- FORTINET logo text -->
  <text x="110" y="345" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="88" fill="white" letter-spacing="-2" filter="url(#glow)">FORTINET</text>

  <!-- Tagline -->
  <text x="112" y="390" font-family="Arial, sans-serif" font-weight="400" font-size="22" fill="#DA291C" letter-spacing="6">CYBERSECURITY LEADER</text>

  <!-- Bottom accent line -->
  <rect x="80" y="420" width="520" height="3" fill="url(#accent)" rx="2" opacity="0.7"/>

  <!-- Partner badge -->
  <rect x="80" y="450" width="220" height="44" rx="4" fill="#DA291C" opacity="0.15" stroke="#DA291C" stroke-width="1"/>
  <text x="190" y="478" font-family="Arial, sans-serif" font-weight="700" font-size="15" fill="#DA291C" text-anchor="middle" letter-spacing="2">PARTNER CONTENT</text>
</svg>
